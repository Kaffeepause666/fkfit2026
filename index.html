<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FKF IT 2026</title>

  <!-- PWA / Icon -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#000000">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
    }

    .container {
      padding: 10px;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    select {
      width: 90%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 30%;
      padding: 12px;
      background: rgba(0,0,0,0.7);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: rgba(255,255,255,0.2);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Head -->
  <h1 id="headText">Tourtag</h1>

  <!-- Dropdown -->
  <select id="parkDropdown"></select>

  <!-- Park Main -->
  <div id="rowParkMain" class="row"></div>

  <!-- Social -->
  <div id="rowSocial" class="row"></div>

  <!-- Count -->
  <div id="rowCount" class="row"></div>

  <!-- Wetter -->
  <div id="rowWeather" class="row"></div>

  <!-- Hotel -->
  <div id="rowHotel" class="row"></div>

  <!-- Impressum -->
  <div class="row">
    <a class="btn" href="#">Tour Guide</a>
    <a class="btn" href="#">Impressum</a>
  </div>

</div>

<script>
async function loadCSV() {
  const response = await fetch('data.csv');
  const text = await response.text();
  return parseCSV(text);
}

function parseCSV(text) {
  const lines = text.trim().split('
');
  const headers = lines[0].split(',');

  return lines.slice(1).map(line => {
    const values = line.split(',');
    let obj = {};
    headers.forEach((h, i) => obj[h.trim()] = values[i] ? values[i].trim() : '');
    return obj;
  });
}

function formatDate(date) {
  return date.toISOString().split('T')[0];
}

function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return formatDate(d);
}

function getWeather(row, today) {
  const d0 = formatDate(today);
  const d1 = addDays(today, 1);
  const d2 = addDays(today, 2);
  const d3 = addDays(today, 3);

  if (row.Datum === d0) return row.Wetter_H;
  if (row.Datum === d1) return row.Wetter_M;
  if (row.Datum === d2 || row.Datum === d3) return row.Wetter_3;
  return row.Wetter_7;
}

function createButton(label, link) {
  if (!link) return null;
  const a = document.createElement('a');
  a.className = 'btn';
  a.href = link;
  a.target = '_blank';
  a.innerText = label;
  return a;
}

function renderRow(containerId, buttons) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';

  const valid = buttons.filter(b => b !== null);
  if (valid.length === 0) {
    container.classList.add('hidden');
    return;
  }

  container.classList.remove('hidden');
  valid.forEach(btn => container.appendChild(btn));
}

function updateUI(row) {
  // Head
  document.getElementById('headText').innerText =
    `Tourtag ${row.Tourtag} - ${row.Wochentag}, ${row.Datum}`;

  // Reihen
  renderRow('rowParkMain', [
    createButton('Park Webseite', row.Park_Web),
    createButton('Park Map', row.Park_Map_P),
    createButton('Google Maps', row.Park_Maps_G)
</script>

</body>
</html>
